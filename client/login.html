<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – AgriShare</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="agri-navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon">🌾</div>
        <div class="brand-text">Agri<span>Share</span></div>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link-item" data-i18n="nav.home">Home</a></li>
        <li><a href="explore.html" class="nav-link-item" data-i18n="nav.explore">Explore Resources</a></li>
        <li><a href="about.html" class="nav-link-item" data-i18n="nav.about">About Us</a></li>
      </ul>

      <div class="nav-actions">
        <button id="langToggleBtn" class="lang-toggle-btn" title="Switch Language">
          🌐 <strong>मराठी</strong>
        </button>
      </div>
    </div>
  </nav>

  <!-- Login Form Wrapper -->
  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">👨‍🌾</div>
        <h2 style="font-size: 1.8rem; color: var(--forest-green); margin-bottom: 0.3rem;">Welcome to AgriShare</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to your farmer or admin account to continue.</p>
      </div>

      <div id="authError" class="alert-box alert-error" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Registered Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="e.g. rameshwar.patil@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <div style="margin: 1.5rem 0 1rem;">
          <button type="submit" class="btn-agri-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">
            Sign In to Platform →
          </button>
        </div>

        <div style="text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-top: 1.25rem;">
          New to AgriShare? <a href="register.html" style="font-weight: 700; color: var(--forest-green);">Register as a Farmer</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="agri-footer">
    <div class="footer-container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <span data-i18n="footer.rights">© 2026 AgriShare. Developed by Multidisciplinary Engineering Project Team.</span>
        <span>MDM Minor Project – Remote Sensing & GIS</span>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
